<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pickmos AI — Create Anything</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WFNKX6LRHS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WFNKX6LRHS');

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      color: #fff;
      background: #030303;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* =====================================================
       PAGE LAYOUT
    ===================================================== */

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      position: relative;
      z-index: 2;
    }

    /* =====================================================
       AI BACKGROUND (from previous code)
    ===================================================== */

    #ai-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -20;
      pointer-events: none;
      background: #030303;
    }

    .ai-grid {
      position: fixed;
      inset: 0;
      z-index: -18;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(ellipse at center, black 10%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 78%);
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      from { transform: translateY(0); }
      to { transform: translateY(70px); }
    }

    .glow-one,
    .glow-two,
    .glow-three {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(90px);
      z-index: -19;
      opacity: .18;
    }

    .glow-one {
      width: 420px;
      height: 420px;
      top: -180px;
      left: 15%;
      background: rgba(255,255,255,.15);
      animation: glowFloatOne 12s ease-in-out infinite;
    }

    .glow-two {
      width: 500px;
      height: 500px;
      right: -220px;
      top: 30%;
      background: rgba(110,130,255,.10);
      animation: glowFloatTwo 15s ease-in-out infinite;
    }

    .glow-three {
      width: 350px;
      height: 350px;
      bottom: -150px;
      left: 20%;
      background: rgba(255,255,255,.09);
      animation: glowFloatThree 13s ease-in-out infinite;
    }

    @keyframes glowFloatOne {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(120px,70px); }
    }

    @keyframes glowFloatTwo {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(-100px,-60px); }
    }

    @keyframes glowFloatThree {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(80px,-70px); }
    }

    .background-overlay {
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 15%, rgba(0,0,0,.22) 60%, rgba(0,0,0,.72) 100%);
    }

    /* =====================================================
       NAVBAR
    ===================================================== */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      padding: 15px 0;
    }

    .nav-inner {
      width: min(900px, 92%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 20px;
      font-weight: 800;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      background: #fff;
      color: red;
      border-radius: 8px;
    }

    /* =====================================================
       FOUNDER MENU
    ===================================================== */

    .founder-menu {
      position: relative;
    }

    .founder-button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      color: #aaa;
      background: rgba(20, 20, 20, .7);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      transition: .25s ease;
    }

    .founder-button:hover {
      color: #fff;
      background: rgba(40, 40, 40, .85);
      border-color: rgba(255, 255, 255, .25);
    }

    .founder-button svg {
      width: 17px;
      height: 17px;
    }

    .founder-arrow {
      width: 12px !important;
      height: 12px !important;
      transition: transform .25s ease;
    }

    .founder-menu.active .founder-arrow {
      transform: rotate(180deg);
    }

    .founder-dropdown {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 290px;
      padding: 18px;
      background: rgba(10, 10, 10, .97);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .7);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px) scale(.96);
      transition: .25s ease;
    }

    .founder-menu.active .founder-dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .founder-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 15px;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .founder-avatar {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: #fff;
      color: #050805;
      font-weight: 800;
    }

    .founder-name {
      font-size: 16px;
      font-weight: 700;
    }

    .founder-role {
      color: #777;
      font-size: 12px;
    }

    .founder-contact a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px;
      color: #999;
      font-size: 12px;
      border-radius: 8px;
      transition: .2s ease;
    }

    .founder-contact a:hover {
      color: #fff;
      background: rgba(255, 255, 255, .06);
    }

    /* =====================================================
       CONTENT
    ===================================================== */

    .container {
      width: min(900px, 92%);
      margin: auto;
      padding: 80px 0 100px;
    }

    .hero {
      min-height: 650px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .launching-soon {
      width: fit-content;
      margin: 0 auto 38px;
      padding: 9px 19px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 100px;
      background: rgba(20, 20, 20, .7);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 8px 40px rgba(0, 0, 0, .4);
      animation: launchPulse 3s ease-in-out infinite;
    }

    @keyframes launchPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    h1 {
      max-width: 760px;
      margin: 0 auto 20px;
      text-align: center;
      font-size: clamp(42px, 7vw, 68px);
      line-height: 1.05;
      letter-spacing: -3px;
    }

    h1 span {
      background: linear-gradient(90deg, #aaa, #fff, #aaa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 5s linear infinite;
    }

    @keyframes textShine {
      to { background-position: 200% center; }
    }

    .subtitle {
      max-width: 560px;
      margin: 0 auto;
      color: #999;
      text-align: center;
      font-size: 16px;
    }

    /* =====================================================
       GENERATOR
    ===================================================== */

    .generator {
      margin-top: 60px;
      padding: 24px;
      background: rgba(20, 20, 20, .85);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 18px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .5);
    }

    textarea {
      width: 100%;
      min-height: 115px;
      padding: 16px;
      color: #fff;
      background: rgba(10, 10, 10, .9);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 12px;
      outline: none;
      resize: vertical;
      font-family: inherit;
      font-size: 15px;
    }

    textarea:focus {
      border-color: rgba(255, 255, 255, .3);
      box-shadow: 0 0 30px rgba(255, 255, 255, .05);
    }

    textarea::placeholder {
      color: #666;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    select {
      padding: 10px 14px;
      color: #fff;
      background: #111;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
    }

    .generate-btn {
      width: 100%;
      padding: 14px 28px;
      color: #000;
      background: #fff;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      transition: .25s ease;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(255, 255, 255, .15);
    }

    /* =====================================================
       FEATURES
    ===================================================== */

    .features-section {
      padding-top: 20px;
    }

    .section-title {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .section-sub {
      color: #777;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .feature {
      padding: 20px;
      background: rgba(20, 20, 20, .75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 13px;
      transition: .3s ease;
    }

    .feature:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, .2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
    }

    .feature h3 {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .feature p {
      color: #888;
      font-size: 13px;
    }

    /* =====================================================
       FOOTER
    ===================================================== */

    footer {
      position: relative;
      z-index: 5;
      width: 100%;
      margin-top: auto;
      padding: 28px 20px;
      background: rgba(10, 10, 10, .9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .footer-inner {
      width: min(900px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 25px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .footer-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #777;
      font-size: 12px;
      transition: color .2s ease, transform .2s ease;
    }

    .footer-links a:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    .footer-links svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {
      .container {
        width: 92%;
        padding-top: 45px;
        padding-bottom: 70px;
      }

      .hero {
        min-height: 560px;
      }

      h1 {
        font-size: 39px;
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 14px;
      }

      .generator {
        padding: 16px;
      }

      .founder-dropdown {
        width: 270px;
        right: -5px;
      }

      .footer-inner {
        min-height: 30px;
      }

      footer {
        padding: 25px 16px;
      }

      .footer-links a {
        font-size: 12px;
      }

      .ai-grid {
        background-size: 45px 45px;
      }
    }

    @media (max-width: 380px) {
      .founder-button {
        padding: 7px 9px;
        font-size: 12px;
      }

      h1 {
        font-size: 34px;
      }

      .footer-links a {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- AI Background -->
  <canvas id="ai-background"></canvas>
  <div class="ai-grid"></div>
  <div class="glow-one"></div>
  <div class="glow-two"></div>
  <div class="glow-three"></div>
  <div class="background-overlay"></div>

  <!-- =====================================================
       NAVBAR
  ===================================================== -->

  <header class="navbar">
    <div class="nav-inner">
      <!-- logo / founder menu remain commented as in original -->
    </div>
  </header>

  <!-- =====================================================
       MAIN
  ===================================================== -->

  <main>
    <div class="container">
      <div class="launching-soon">
        ✦ Pickmos ✦
      </div>
      <p class="subtitle">
        Contact - sauravbir6@gmail.com
      </p> <br>

       <div class="footer-links">
        <a
          href="https://x.com/sauravbir"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          @sauravbir
        </a> 
      </div> 
        
    </div>
  </main>

  <!-- =====================================================
       FOOTER
  ===================================================== -->

  <footer>
    <div class="footer-inner">
      <div class="footer-links">
        <a
          href="https://x.com/sauravbir"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          @sauravbir
        </a> 
      </div> 
      
    </div>
  </footer>

</div>

<script>
  /* =====================================================
     PREMIUM NEURAL NETWORK BACKGROUND
  ===================================================== */
  const canvas = document.getElementById("ai-background");
  const ctx = canvas.getContext("2d");

  let width, height;
  let particles = [];
  let mouse = { x: null, y: null };

  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    createParticles();
  }

  window.addEventListener("mousemove", function(event) {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
  });

  window.addEventListener("mouseleave", function() {
    mouse.x = null;
    mouse.y = null;
  });

  class Particle {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - .5) * .28;
      this.vy = (Math.random() - .5) * .28;
      this.radius = Math.random() * 1.5 + .4;
      this.alpha = Math.random() * .4 + .08;
      this.pulse = Math.random() * Math.PI * 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.pulse += .01;

      if (mouse.x !== null && mouse.y !== null) {
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const influence = 150;

        if (distance < influence) {
          const force = (1 - distance / influence) * .012;
          this.x += dx * force;
          this.y += dy * force;
        }
      }

      if (this.x < -20) this.x = width + 20;
      if (this.x > width + 20) this.x = -20;
      if (this.y < -20) this.y = height + 20;
      if (this.y > height + 20) this.y = -20;
    }

    draw() {
      const pulse = Math.sin(this.pulse) * .3 + .7;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${this.alpha * pulse})`;
      ctx.fill();

      if (this.radius > 1.2) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${this.alpha * .04})`;
        ctx.fill();
      }
    }
  }

  function createParticles() {
    particles = [];
    const density = window.innerWidth < 700 ? 55 : 105;
    for (let i = 0; i < density; i++) {
      particles.push(new Particle());
    }
  }

  function drawConnections() {
    const maxDistance = window.innerWidth < 700 ? 105 : 145;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const p1 = particles[i];
        const p2 = particles[j];
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < maxDistance) {
          const opacity = (1 - distance / maxDistance) * .12;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
          ctx.lineWidth = .6;
          ctx.stroke();
        }
      }
    }
  }

  function drawMouseConnections() {
    if (mouse.x === null || mouse.y === null) return;
    const distanceLimit = 190;

    particles.forEach(particle => {
      const dx = particle.x - mouse.x;
      const dy = particle.y - mouse.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < distanceLimit) {
        const opacity = (1 - distance / distanceLimit) * .2;
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(particle.x, particle.y);
        ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
        ctx.lineWidth = .7;
        ctx.stroke();
      }
    });
  }

  function animateBackground() {
    ctx.clearRect(0, 0, width, height);
    drawConnections();
    drawMouseConnections();
    particles.forEach(particle => {
      particle.update();
      particle.draw();
    });
    requestAnimationFrame(animateBackground);
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  animateBackground();
</script>

</body>
